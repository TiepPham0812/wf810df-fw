name: Build WF810DF - ImmortalWrt tu ma nguon

# Dong firmware ImmortalWrt cho FPT AX3000CV2 (Actiontec/CIG WF-810DF, IPQ5018)
# bang cach BIEN DICH TU MA NGUON ImmortalWrt chinh hang + phan ho tro thiet bi
# lay tu zcop/immortalwrt nhanh wf810df-25.12 (DTS, driver switch YT921x, cau hinh).
# Mat khoang 2-4 gio cho 1 lan build.

on:
  workflow_dispatch:
    inputs:
      iw_ref:
        description: "Phien ban ImmortalWrt (tag vd v25.12.2, hoac nhanh openwrt-25.12)"
        default: "v25.12.2"
        required: true
      extra_packages:
        description: "Goi cai them vao firmware, cach nhau dau cach (de trong neu khong can)"
        default: ""
        required: false

permissions:
  contents: write
  pages: write      # dang kho kmod len GitHub Pages (buoc 14)
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # Moi truong github-pages: can de buoc 14 dang kho kmod.
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    timeout-minutes: 350
    steps:
      - name: 1. Lay ma nguon repo
        uses: actions/checkout@v6

      - name: 2. Don dung luong o dia (build can ~30 GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: 3. Cai cong cu build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd xz-utils python3-dev libelf-dev

      - name: 4. Tai ma nguon ImmortalWrt chinh hang
        run: |
          git clone --depth 1 -b "${{ inputs.iw_ref }}" https://github.com/immortalwrt/immortalwrt.git iw
          cd iw && git log -1 --format='ImmortalWrt: %H %cd'
          cat target/linux/generic/kernel-6.12 | head -1

      - name: 4b. Lay vermagic kernel ImmortalWrt chinh hang (dong bo kernel)
        run: |
          # Firmware dung chung vermagic voi ban chinh hang -> router cai kmod tu kho chinh hang.
          REF="${{ inputs.iw_ref }}"
          case "$REF" in v[0-9]*.[0-9]*.[0-9]*) VER=${REF#v} ;; *) echo "LOI: dong bo kernel can tag phat hanh (vd v25.12.2), khong dung nhanh '$REF'"; exit 1 ;; esac
          URL="https://downloads.immortalwrt.org/releases/$VER/targets/qualcommax/ipq50xx/kmods/"
          DIRS=$(curl -fsSL --retry 3 "$URL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9a-f]{32}' | sort -u)
          [ "$(echo "$DIRS" | grep -c .)" = 1 ] || { echo "LOI: khong xac dinh duoc thu muc kmods chinh hang tai $URL:"; echo "$DIRS"; exit 1; }
          KVER=${DIRS%%-*}; REST=${DIRS#*-}; KREL=${REST%%-*}; KHASH=${REST#*-}
          SRCVER="6.12$(sed -n 's/^LINUX_VERSION-6.12 = //p' iw/target/linux/generic/kernel-6.12)"
          echo "Chinh hang: kernel $KVER, release $KREL, vermagic $KHASH | Ma nguon: kernel $SRCVER"
          [ "$KVER" = "$SRCVER" ] || { echo "LOI: kernel ma nguon ($SRCVER) khac ban chinh hang ($KVER)"; exit 1; }
          { echo "IW_VER=$VER"; echo "OFFICIAL_KVER=$KVER"; echo "OFFICIAL_KREL=$KREL"; echo "OFFICIAL_VERMAGIC=$KHASH"
            echo "OFFICIAL_KMODS=https://downloads.immortalwrt.org/releases/$VER/targets/qualcommax/ipq50xx/kmods/$DIRS/packages.adb"; } >> "$GITHUB_ENV"

      - name: 5. Cap nhat feeds
        working-directory: iw
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. Them ho tro FPT AX3000CV2
        run: |
          python3 scripts/add-device.py iw
          # files/ = noi dung chep thang vao firmware (board-2.bin Wi-Fi, mui gio VN)
          cp -a files iw/files
          sed -i 's/\r$//' iw/files/etc/uci-defaults/*; chmod 755 iw/files/etc/uci-defaults/*

      - name: 6b. Khoa ky goi + kho kmod rieng (GitHub Pages)
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          # Kho kmod rieng: kernel tu build nen kmod kho chinh hang khong cai duoc.
          # Router doc them kho nay -> "apk add kmod-xxx" chay thang.
          KMOD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/packages/packages.adb"
          mkdir -p iw/files/etc/apk/repositories.d
          {
            # Kernel dong bo voi ban chinh hang -> dung kho kmods/ chinh hang (ImmortalWrt
            # chi tu them dong nay khi build tren buildbot cua ho).
            printf '# Kho kmod ImmortalWrt chinh hang (kernel %s, vermagic %s)\n%s\n' "$OFFICIAL_KVER" "$OFFICIAL_VERMAGIC" "$OFFICIAL_KMODS"
            # Kmod rieng cua 810 (kmod-dsa-yt921x) + toan bo kmod cua dung ban build nay
            printf '# Kho kmod cua dung kernel firmware nay (GitHub Pages, buoc 14)\n%s\n' "$KMOD_URL"
          } > iw/files/etc/apk/repositories.d/customfeeds.list
          cat iw/files/etc/apk/repositories.d/customfeeds.list
          # Khoa ky co dinh (secret APK_SIGN_KEY) -> moi ban build dung chung 1 khoa,
          # router o ban cu van tin kho kmod moi. Khong co secret: build tu tao khoa moi.
          if [ -n "$APK_SIGN_KEY" ]; then
            printf '%s\n' "$APK_SIGN_KEY" > iw/private-key.pem
            openssl ec -in iw/private-key.pem -noout && echo "OK  dung khoa ky APK_SIGN_KEY" \
              || { echo "LOI: APK_SIGN_KEY khong phai khoa EC hop le"; exit 1; }
          else
            echo "CANH BAO: chua co secret APK_SIGN_KEY - khoa ky doi theo tung ban build"
          fi

      - name: 7. Tao cau hinh
        working-directory: iw
        run: |
          cp ../config/wf810df.seed .config
          for p in ${{ inputs.extra_packages }}; do echo "CONFIG_PACKAGE_$p=y" >> .config; done
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_wf810df=y' .config || { echo "LOI: khong chon duoc thiet bi"; exit 1; }
          grep -q '^CONFIG_PACKAGE_default-settings-chn=y' .config && { echo "LOI: van con default-settings-chn"; exit 1; }
          for p in ${{ inputs.extra_packages }}; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "LOI: goi '$p' khong ton tai hoac thieu phu thuoc"; exit 1; }
          done
          # Goi lay tu ban NR3053 (seed) phai duoc chon that su, khong bi defconfig bo qua
          for p in kmod-tun tailscale sqm-scripts kmod-sched-cake luci-app-sqm kmod-wireguard wireguard-tools luci-proto-wireguard luci-app-filemanager; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "LOI: goi '$p' trong seed khong duoc chon"; exit 1; }
          done
          grep -q '^CONFIG_CCACHE=y' .config || { echo "LOI: CONFIG_CCACHE chua bat"; exit 1; }
          # Dong bo kernel: tinh truoc vermagic (truoc khi bien dich 2-4 gio)
          V=$(../scripts/vermagic.sh .)
          echo "Vermagic du kien: $V | chinh hang: $OFFICIAL_VERMAGIC"
          if [ "$V" != "$OFFICIAL_VERMAGIC" ]; then
            echo "LOI: cau hinh kernel lech ban chinh hang -> kmod chinh hang se khong cai duoc."
            echo "Nguyen nhan thuong gap: seed/extra_packages them CONFIG_KERNEL_*, bo CONFIG_DEVEL/CONFIG_ALL_KMODS,"
            echo "hoac them kmod khong co trong ImmortalWrt. Cac dong CONFIG_KERNEL_* hien tai:"
            grep -E '^(# )?CONFIG_KERNEL_' .config | grep -vE 'BUILD_(USER|DOMAIN)' | head -50
            exit 1
          fi
          ./scripts/diffconfig.sh > ../diffconfig.txt
          cat ../diffconfig.txt

      - name: 7b. Khoi phuc bo dem bien dich (ccache)
        # Lay tu workflow NR3053: build lan sau dung lai ket qua bien dich lan truoc.
        # Khoa theo iw_ref; doi phien ban ImmortalWrt thi van thu dung cache cu (trung mot phan).
        uses: actions/cache/restore@v4
        with:
          path: iw/.ccache
          key: ccache-wf810df-${{ inputs.iw_ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-wf810df-${{ inputs.iw_ref }}-
            ccache-wf810df-

      - name: 8. Tai ma nguon cac goi
        working-directory: iw
        run: make download -j8 || make download -j1 V=s

      - name: 9. Bien dich (2-4 gio, nhanh hon khi co ccache)
        working-directory: iw
        env:
          CCACHE_MAXSIZE: 3G
        run: |
          echo "Bat dau: $(date)"
          make -j$(($(nproc)+1)) || { echo "=== Loi, chay lai 1 luong de xem log chi tiet ==="; make -j1 V=s; }
          echo "Xong: $(date)"; df -h /
          CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -s 2>/dev/null || du -sh .ccache 2>/dev/null || true

      - name: 9b. Luu bo dem bien dich (ca khi build loi)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: iw/.ccache
          key: ccache-wf810df-${{ inputs.iw_ref }}-${{ github.run_id }}

      - name: 10. Kiem tra firmware
        working-directory: iw
        run: |
          OUT=bin/targets/qualcommax/ipq50xx
          ls -l $OUT
          for s in squashfs-factory.ubi squashfs-sysupgrade.bin initramfs-uImage.itb; do
            ls $OUT/*wf810df*-$s >/dev/null 2>&1 || { echo "LOI: thieu file *-$s"; exit 1; }
          done
          M=$(ls $OUT/*wf810df*.manifest | head -1)
          for k in kmod-ath11k-ahb ath11k-firmware-ipq5018-qcn6122 kmod-dsa-yt921x luci kmod-tun tailscale luci-app-tailscale-community sqm-scripts kmod-sched-cake luci-app-sqm kmod-wireguard wireguard-tools luci-proto-wireguard luci-app-filemanager; do
            grep -q "^$k " "$M" && echo "OK  $k" || { echo "THIEU $k"; exit 1; }
          done
          grep -q "^default-settings-chn " "$M" && { echo "LOI: con default-settings-chn"; exit 1; }
          strings build_dir/target-*/linux-qualcommax_ipq50xx/image-ipq5018-wf810df.dtb | grep -q "fpt,wf810df" \
            && echo "OK  DTB AX3000CV2" || { echo "LOI: DTB khong phai AX3000CV2"; exit 1; }
          grep -q "CONFIG_NET_DSA_YT921X=[ym]" build_dir/target-*/linux-qualcommax_ipq50xx/linux-*/.config \
            && echo "OK  driver switch YT921x" || { echo "LOI: kernel thieu driver YT921x"; exit 1; }
          # --- THEM: kiem tra metadata sysupgrade ---
          SU=$(ls $OUT/*wf810df*-squashfs-sysupgrade.bin)
          for b in fpt,wf810df fpt,ax3000cv2; do
            tail -c 4096 "$SU" | strings | grep -q "\"$b\"" \
              && echo "OK  sysupgrade ho tro $b" || { echo "LOI: metadata thieu $b"; exit 1; }
          done
          # --- HET PHAN THEM ---
          # Driver ath11k goc khong doc qcom,board_id trong DTS -> firmware bao board-id 255.
          # board-2.bin phai co ban ghi qmi-board-id=255, neu khong Wi-Fi khong len.
          for c in IPQ5018 QCN6122; do
            B=$(ls build_dir/target-*/root-qualcommax*/lib/firmware/ath11k/$c/hw1.0/board-2.bin | head -1)
            grep -aq "qmi-board-id=255" "$B" \
              && echo "OK  $c board-2.bin co board-id 255" || { echo "LOI: $c board-2.bin thieu board-id 255"; exit 1; }
          done
          # WAN chi len 100 Mbps khi GE PHY dat qcom,dac-preset-short-cable (giam bien do DAC
          # cho day ngan noi switch tren mach). O may nay GE PHY ra thang cong WAN RJ45.
          strings build_dir/target-*/linux-qualcommax_ipq50xx/image-ipq5018-wf810df.dtb | grep -q "dac-preset-short-cable" \
            && { echo "LOI: DTB con qcom,dac-preset-short-cable -> WAN se chi chay 100M"; exit 1; } \
            || echo "OK  GE PHY khong dat dac-preset-short-cable"
          # Dong bo kernel: goi kernel phai mang dung vermagic chinh hang
          KAPK="kernel-${OFFICIAL_KVER}~${OFFICIAL_VERMAGIC}-r${OFFICIAL_KREL}.apk"
          test -f "$OUT/packages/$KAPK" && echo "OK  kernel dong bo chinh hang: $KAPK" \
            || { echo "LOI: khong co $KAPK - kernel KHONG dong bo:"; ls $OUT/packages/kernel-*.apk; exit 1; }
          grep -qF "$OFFICIAL_KMODS" build_dir/target-*/root-qualcommax*/etc/apk/repositories.d/customfeeds.list \
            && echo "OK  firmware tro toi kho kmod chinh hang" || { echo "LOI: thieu kho kmod chinh hang trong customfeeds.list"; exit 1; }
          curl -fsSI --retry 3 "$OFFICIAL_KMODS" >/dev/null && echo "OK  kho kmod chinh hang ton tai" \
            || { echo "LOI: khong truy cap duoc $OFFICIAL_KMODS"; exit 1; }
          # Driver switch YT921x van phai co trong kernel (bi bo khoi vermagic, khong bi bo khoi kernel)
          grep -q "^CONFIG_NET_DSA_YT921X=m" build_dir/target-*/linux-qualcommax_ipq50xx/linux-*/.config \
            && echo "OK  YT921x van la module" || { echo "LOI: kernel mat YT921x"; exit 1; }
          # Firmware phai tro toi kho kmod rieng
          grep -q "github.io/.*/packages/packages.adb" build_dir/target-*/root-qualcommax*/etc/apk/repositories.d/customfeeds.list \
            && echo "OK  customfeeds.list tro toi kho kmod" || { echo "LOI: thieu kho kmod trong customfeeds.list"; exit 1; }
          cd $OUT && sha256sum *wf810df* > sha256sums-wf810df.txt && cat sha256sums-wf810df.txt
          
      - name: 11. Dong goi kmod (de cai them bang apk)
        working-directory: iw
        run: |
          test -d bin/targets/qualcommax/ipq50xx/packages || { echo "LOI: khong thay thu muc kmod"; exit 1; }
          tar -C bin/targets/qualcommax/ipq50xx -czf kmods-wf810df.tar.gz packages
          ls -lh kmods-wf810df.tar.gz

      - name: 12. Luu file len Actions (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: wf810df-${{ inputs.iw_ref }}-b${{ github.run_number }}
          path: |
            iw/bin/targets/qualcommax/ipq50xx/*wf810df*
            iw/bin/targets/qualcommax/ipq50xx/sha256sums-wf810df.txt
            diffconfig.txt

      - name: 13. Dang len Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wf810df-${{ inputs.iw_ref }}-b${{ github.run_number }}
          name: WF810DF ImmortalWrt ${{ inputs.iw_ref }} - build ${{ github.run_number }}
          body: |
            FPT AX3000CV2 (WF-810DF) - ImmortalWrt ${{ inputs.iw_ref }} bien dich tu ma nguon.
            - `*-factory.ubi`: nap lan dau qua U-Boot (xem README).
            - `*-initramfs-uImage.itb`: chay thu trong RAM, khong ghi NAND.
            - `*-sysupgrade.bin`: nang cap tu LuCI khi da chay ImmortalWrt.
            - `kmods-wf810df.tar.gz`: toan bo kmod cua dung kernel nay.
            Kernel dong bo ImmortalWrt chinh hang (vermagic ${{ env.OFFICIAL_VERMAGIC }}): cai kmod thang tu kho chinh hang qua LuCI/apk.
            Nen thiet bi: zcop/immortalwrt wf810df-25.12. NSS chua co. Chua kiem chung tren may that: hay chay thu initramfs truoc.
          # *wf810df* da gom ca sha256sums-wf810df.txt; liet ke them lan nua se
          # tai trung 1 file -> loi "Not Found" (update-a-release-asset) o build 3.
          files: |
            iw/bin/targets/qualcommax/ipq50xx/*wf810df*
            iw/kmods-wf810df.tar.gz
            diffconfig.txt

      - name: 14a. Chuan bi kho kmod cho GitHub Pages
        working-directory: iw
        run: |
          P=bin/targets/qualcommax/ipq50xx/packages
          test -s $P/packages.adb || { echo "LOI: thieu packages.adb (chi muc kho kmod)"; exit 1; }
          mkdir -p ../pages/packages
          cp -a $P/. ../pages/packages/
          cp public-key.pem ../pages/public-key.pem
          printf '<h1>Kho kmod WF810DF</h1><p>Build %s (%s). Router: xem /etc/apk/repositories.d/customfeeds.list</p>\n' \
            "${{ github.run_number }}" "${{ inputs.iw_ref }}" > ../pages/index.html
          touch ../pages/.nojekyll
          du -sh ../pages; ls ../pages/packages | grep -c '\.apk$'

      - name: 14b. Dang kho kmod len GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: 14c. Trien khai GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
